# Valida el código fuente. Cloudflare Pages realiza el despliegue de producción.
name: Validar sitio Astro

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: astro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: astro-src/.nvmrc
          cache: npm
          cache-dependency-path: astro-src/package-lock.json
      - run: npm ci
      - run: npm run build
